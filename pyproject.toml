[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "voxel-router-desktop"
version = "1.0.0"
description = "VOXEL Router Desktop — Secure DICOM Edge Router"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Proprietary"}
authors = [{name = "VOXEL"}]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydicom>=3.0,<4.0",
  "pynetdicom>=3.0,<4.0",
  "httpx>=0.27,<1.0",
  "argon2-cffi>=23.1,<24.0",
  "cryptography>=43.0,<45.0",
  "defusedxml>=0.7,<1.0",
  "psutil>=6.0,<7.0",
  "structlog>=24.4,<26.0",
  "pywin32>=306; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "ruff>=0.6,<1.0",
]

[project.scripts]
voxel-router = "app.main:run"
voxel-router-service = "app.service_main:run"
voxel-orthanc-service = "app.orthanc.service_main:run"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S104"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 55
